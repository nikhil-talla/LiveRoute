# Minimal libcurl used by the local C++ HTTP/WebSocket clients. V1 exposes the
# backend only on loopback and therefore enables ws/http, not external TLS.
version: 8.5.0
artifact:
  url: https://curl.se/download/curl-8.5.0.tar.xz
  sha256: 42ab8db9e20d8290a3b633e7fbb3cec15db34df65fd1015ef8ac1e4723750eeb
build:
  prefix: /opt/liveroute/curl
  websocket: enabled
  shared_library: enabled
  tls: disabled

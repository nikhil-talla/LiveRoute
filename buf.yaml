version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # These names are fixed by the V1 wire contract for the bidirectional
    # stream and cannot be renamed to satisfy Buf's unary-RPC conventions.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE

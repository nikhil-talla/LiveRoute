name: liveroute

# The skeleton builds the C++ service. The hours-assets check builds the exact
# local seed plus pinned tzdata used by the future seeded-hours adapter. The
# backend, PostgreSQL, OSRM, and dependency-aware readiness checks are added
# with their implementation slices.
services:
  planner-skeleton:
    build:
      context: .
      dockerfile: docker/cpp/Dockerfile
    command: ["--self-check"]
    profiles: ["skeleton"]

  hours-assets-check:
    build:
      context: .
      dockerfile: docker/hours/Dockerfile
    profiles: ["hours"]
